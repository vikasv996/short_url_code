version: '3'
services:
  node-app:
    container_name: node-app
    build: .
    # image: maverick4060/short_url_code:short_url_with_redis
    ports:
      - "4000:4000"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - node-app
