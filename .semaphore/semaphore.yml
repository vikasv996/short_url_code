version: v1.0
name: Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - docker-compose up --build
      secrets:
        - name: dockerhub
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
        containers:
          - name: main
            image: 'semaphoreci/ubuntu:20.04'
      prologue:
        commands:
          - checkout
          - 'echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin'
          - cat docker-compose.yml | envsubst | tee docker-compose.yml
