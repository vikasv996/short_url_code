version: v1.0
name: Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - 'echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin'
            - cat docker-compose.yaml | envsubst | tee docker-compose.yaml
      secrets:
        - name: dockerhub
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
        containers:
          - name: main
            image: 'semaphoreci/ubuntu:20.04'
  - name: Comose
    task:
      jobs:
        - name: docker compose
          commands:
            - docker-compose up --build
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
        containers:
          - name: main
            image: 'semaphoreci/ubuntu:20.04'
