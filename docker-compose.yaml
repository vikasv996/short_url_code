version: '3'
services:
  node-app:
    container_name: node-app
    build: .
    ports:
      - "4000:4000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    volumes:
      - .:/usr/src/app
    networks:
      - app-network

  redis:
    image: "redis:alpine"
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
